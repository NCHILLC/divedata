name: Something is wrong
description: Tell us what went wrong in the app.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it too?
      description: The steps you took, one per line. A screenshot helps.
  - type: input
    id: meet
    attributes:
      label: Which meet? (optional)
      description: A DiveMeets link or meet number, if it was about one meet. Please don't include a diver's name.
  - type: input
    id: phone
    attributes:
      label: Phone and DiveData version
      description: For example "Pixel 8, DiveData 1.0.0" (the version is in the app's settings).
