name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:layers
      - run: npm run check:licenses
      - run: npm run check:fixtures
      - run: npm run check:skills

  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # The Gradle cache goes after prebuild: android/ and its Gradle files only exist once prebuild has run.
      # The basic provider is the open-source (MIT) one. Only main writes the cache; pull requests read it.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # A release build bundles the app's JavaScript, so the APK runs on a phone without a dev server.
      # Expo's template signs release builds with the debug keystore, so no secret is needed.
      # This is a test APK only; real releases are signed with the release key (see the release skill).
      # It is built for arm64 phones only, about a quarter of the native (C++) work of all four chip types.
      # Real releases should build every chip type (docs/decisions/2026-11-21-arm64-test-apk.md).
      - run: ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: divedata-test-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
