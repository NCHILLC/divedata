name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:layers
      - run: npm run check:licenses
      - run: npm run check:fixtures
      - run: npm run check:skills

  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          # No Gradle cache: android/ only exists after expo prebuild, so setup-java finds no Gradle files.
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # A release build bundles the app's JavaScript, so the APK runs on a phone without a dev server.
      # Expo's template signs release builds with the debug keystore, so no secret is needed.
      # This is a test APK only; real releases are signed with the release key (see the release skill).
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: divedata-test-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
