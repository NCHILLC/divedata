// Live mode's reader: a foreground service with its own browser. See modules/live-reader/index.ts.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.divedata'
version = '1.0.0'

android {
  namespace "org.divedata.livereader"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
}
